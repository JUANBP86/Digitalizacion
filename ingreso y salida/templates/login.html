<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Control de personal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="eyebrow">CONTROL DE SALIDAS DEL PERSONAL</p>
        <h1>Iniciar sesión</h1>
        <p class="muted">Use su cuenta compartida de GOTUPLAS. Los permisos dependen del sistema y del rol asignado.</p>
        {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Usuario
                <input name="usuario" autocomplete="username" required autofocus>
            </label>
            <label>Contraseña
                <input name="clave" type="password" autocomplete="current-password" required>
            </label>
            <button class="button button-primary" type="submit">Entrar</button>
        </form>
        <a class="button button-primary back-to-registration"
           href="{{ url_for('salida_instalaciones') }}">Volver al registro de salidas</a>
    </main>
</body>
</html>
