<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurar administrador | Control de personal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="eyebrow">CONFIGURACIÓN INICIAL</p>
        <h1>Crear cuenta administradora</h1>
        <p class="muted">Esta cuenta protegerá el panel de control de salidas del personal.</p>
        {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Usuario
                <input name="usuario" minlength="3" autocomplete="username" required>
            </label>
            <label>Contraseña
                <input name="clave" type="password" minlength="8"
                       autocomplete="new-password" required>
            </label>
            <label>Confirmar contraseña
                <input name="confirmar_clave" type="password" minlength="8"
                       autocomplete="new-password" required>
            </label>
            <button class="button button-primary" type="submit">Crear cuenta</button>
        </form>
    </main>
</body>
</html>
