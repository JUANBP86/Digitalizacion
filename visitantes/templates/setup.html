<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17324d">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='gotuplas.png') }}">
    <title>Crear cuenta de recepción | GOTUPLAS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="brand login-brand" href="/" aria-label="GOTUPLAS">
            <img class="brand-logo" src="{{ url_for('static', filename='gotuplas.png') }}"
                 alt="">
            <span class="brand-copy">
                <small>Control de visitantes</small>
            </span>
        </a>
        <p class="eyebrow">CONFIGURACIÓN INICIAL</p>
        <h1>Crear cuenta de recepción</h1>
        <p class="page-subtitle">
            Esta cuenta será la única con acceso al panel privado de recepción.
        </p>
        {% if error %}
        <div class="login-error" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('configurar_cuenta_recepcion') }}"
              class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label for="usuario">Usuario (mínimo 3 caracteres)</label>
                <input id="usuario" name="usuario" type="text" minlength="3"
                       autocomplete="username" value="{{ request.form.get('usuario', '') }}"
                       required autofocus>
            </div>
            <div class="field">
                <label for="clave">Contraseña (mínimo 6 caracteres)</label>
                <input id="clave" name="clave" type="password" minlength="6"
                       autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmar_clave">Confirmar contraseña</label>
                <input id="confirmar_clave" name="confirmar_clave" type="password"
                       minlength="6" autocomplete="new-password" required>
            </div>
            <button class="button button-primary" type="submit">Guardar cuenta</button>
        </form>
        <a class="back-link" href="/">← Volver al registro de visitante</a>
    </main>
</body>
</html>
