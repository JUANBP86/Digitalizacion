<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Política de tratamiento de datos</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e2e8f0;
        }
        h1 {
            margin: 0;
            font-size: 1rem;
        }
        .back-button {
            flex: 0 0 auto;
            padding: 0.6rem 0.9rem;
            border: 0;
            border-radius: 6px;
            background: #23364a;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }
        main {
            flex: 1;
            min-height: 0;
            padding: 1rem;
            background: #e2e8f0;
        }
        .policy-pages {
            display: grid;
            gap: 1rem;
            justify-items: center;
        }
        .policy-page {
            display: block;
            width: min(100%, 900px);
            height: auto;
            background: #fff;
            box-shadow: 0 2px 10px rgb(15 23 42 / 16%);
        }
        .unavailable {
            text-align: center;
        }
        @media (max-width: 480px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <button class="back-button" id="backToRegistration" type="button">
            Volver al registro
        </button>
        <h1>Política de tratamiento de datos personales</h1>
    </header>
    <main>
        {% if politica_disponible %}
        <div class="policy-pages" aria-label="Política de tratamiento de datos personales">
            {% for numero_pagina in range(1, politica_paginas + 1) %}
            <img class="policy-page"
                 src="{{ url_for('pagina_politica_tratamiento_datos', numero_pagina=numero_pagina) }}"
                 alt="Página {{ numero_pagina }} de {{ politica_paginas }}"
                 {% if numero_pagina > 1 %}loading="lazy"{% endif %}>
            {% endfor %}
        </div>
        {% else %}
        <div class="unavailable">
            <p>La política de tratamiento de datos aún no está disponible.</p>
        </div>
        {% endif %}
    </main>
    <script>
        document.getElementById("backToRegistration").addEventListener("click", () => {
            if (document.referrer.startsWith(window.location.origin)) {
                window.history.back();
            } else {
                window.location.replace("{{ url_for('inicio') }}");
            }
        });
    </script>
</body>
</html>
